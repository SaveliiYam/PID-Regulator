; Local check of examples/Basic only.
; Consumers should depend on this library via git / path — see README.md

[platformio]
default_envs = example
src_dir = examples/Basic

[env:example]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	"-I${PROJECT_DIR}/src"
build_src_filter =
	+<*>
	+<../../src/PidController.cpp>
