; Local Wokwi verification with a simulated inertial plant.
; Consumers use git/path — see README.

[platformio]
default_envs = wokwi
src_dir = examples/Wokwi

[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	"-I${PROJECT_DIR}/src"
build_src_filter =
	+<*>
	+<../../src/PidController.cpp>
	+<../../src/PidAutotuner.cpp>
	+<../../src/ZieglerNicholsRule.cpp>
