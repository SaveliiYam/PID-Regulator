; Local check of examples/Autotune.
; For Basic locally: set src_dir = examples/Basic
; Consumers use git/path — see README.

[platformio]
default_envs = example
src_dir = examples/Autotune

[env:example]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	"-I${PROJECT_DIR}/src"
build_src_filter =
	+<*>
	+<../../src/PidController.cpp>
	+<../../src/PidAutotuner.cpp>
	+<../../src/ZieglerNicholsRule.cpp>
